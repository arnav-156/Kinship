name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: relationship
          POSTGRES_PASSWORD: relationship
          POSTGRES_USER: relationship
        options: >-
          --health-cmd "pg_isready -U relationship -d relationship"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://relationship:relationship@localhost:5432/relationship
      SHADOW_DATABASE_URL: postgresql://relationship:relationship@localhost:5432/relationship_shadow
      S3_ACCESS_KEY_ID: minioadmin
      S3_BUCKET: relationship-ci
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Start S3-compatible object storage
        run: |
          docker run --detach --name relationship-object-storage \
            --publish 9000:8333 \
            --env AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            --env S3_BUCKET="$S3_BUCKET" \
            ghcr.io/chrislusf/seaweedfs:4.48 mini -dir=/data
          for attempt in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9000/ || true)"
            if [ "$status" != "000" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs relationship-object-storage
          exit 1

      - name: Prisma validate
        run: corepack pnpm db:validate

      - name: Prisma generate
        run: corepack pnpm db:generate

      - name: Create Prisma shadow database
        run: docker exec ${{ job.services.postgres.id }} createdb -U relationship relationship_shadow

      - name: Prisma migration check
        run: corepack pnpm db:migration:check

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: API contract compatibility
        run: corepack pnpm api:contract check

      - name: Security regression corpus
        run: corepack pnpm security:regression

      - name: Test
        run: corepack pnpm test

      - name: Object storage integration
        env:
          RUN_STORAGE_INTEGRATION: "true"
        run: corepack pnpm --filter @relationship/storage exec vitest run src/s3.integration.spec.ts

      - name: Build
        run: corepack pnpm build
