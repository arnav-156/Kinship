services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: relationship
      POSTGRES_PASSWORD: relationship
      POSTGRES_USER: relationship
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationship -d relationship"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  object-storage:
    image: ghcr.io/chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: relationship-local
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${S3_API_PORT:-9000}:8333"
    volumes:
      - object-storage-data:/data

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://relationship:relationship@postgres:5432/relationship
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:8333
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${API_PORT:-7000}:4000"

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql://relationship:relationship@postgres:5432/relationship
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:8333

  scheduler:
    build:
      context: ..
      dockerfile: infrastructure/docker/scheduler.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql://relationship:relationship@postgres:5432/relationship
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:8333

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  object-storage-data:
  postgres-data:
  redis-data:
