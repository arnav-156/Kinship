services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: relationship
      POSTGRES_PASSWORD: relationship
      POSTGRES_USER: relationship
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationship -d relationship"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://relationship:relationship@postgres:5432/relationship
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${API_PORT:-7000}:4000"

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql://relationship:relationship@postgres:5432/relationship
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000

  scheduler:
    build:
      context: ..
      dockerfile: infrastructure/docker/scheduler.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql://relationship:relationship@postgres:5432/relationship
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  minio-data:
  postgres-data:
  redis-data:
